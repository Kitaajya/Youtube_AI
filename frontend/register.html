<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - YouTube</title>
    <link rel="stylesheet" href="css/vars.css">
    <script>(function(){try{var s=localStorage.getItem('yt-theme');var d=s==='dark'||(s!=='light'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.setAttribute('data-theme',d?'dark':'light');}catch(e){document.documentElement.setAttribute('data-theme','light');}})();</script>
    <link rel="stylesheet" href="css/dark.css">
    <link rel="stylesheet" href="css/register.css">
</head>
<body>
    <header class="yt-header">
        <div class="yt-logo">
            <svg viewBox="0 0 90 20" height="20"><path d="M27.97 3.12A3.51 3.51 0 0 0 25.5.64C23.27.07 14.6.07 14.6.07S5.93.07 3.7.64A3.51 3.51 0 0 0 1.23 3.12C.66 5.35.66 10 .66 10s0 4.65.57 6.88a3.51 3.51 0 0 0 2.47 2.48c2.23.57 10.9.57 10.9.57s8.67 0 10.9-.57a3.51 3.51 0 0 0 2.47-2.48c.57-2.23.57-6.88.57-6.88s0-4.65-.57-6.88z" fill="#FF0000"/><path d="M11.73 14.29L19.06 10l-7.33-4.29z" fill="#fff"/></svg>
            <span class="yt-logo-text">YouTube</span>
        </div>
    </header>
    <main class="yt-main">
        <div class="yt-card">
            <h1>创建您的账号</h1>
            <p class="yt-sub">加入 YouTube，开始探索精彩世界</p>
            <form id="registerForm">
                <div class="field">
                    <label>用户名 <span class="req">*</span></label>
                    <input type="text" id="username" placeholder="请输入用户名" required>
                </div>
                <div class="field">
                    <label>密码 <span class="req">*</span></label>
                    <input type="password" id="password" placeholder="请输入密码" required>
                </div>
                <div class="field">
                    <label>昵称 <span class="req">*</span></label>
                    <input type="text" id="nickname" placeholder="请输入昵称" required>
                </div>
                <div class="field">
                    <label>邮箱</label>
                    <input type="email" id="email" placeholder="请输入邮箱">
                </div>
                <div class="field">
                    <label>手机号 <span class="req">*</span></label>
                    <input type="tel" id="phone" placeholder="请输入手机号" required>
                </div>
                <button type="submit" id="submitBtn">注册</button>
                <p class="tip" id="tip"></p>
                <p class="yt-sub" style="text-align:center;margin-top:16px;"><a href="login.html" style="color:var(--link);text-decoration:none;">已有账号？去登录</a>　·　<a href="index.html" style="color:var(--text-secondary);text-decoration:none;">或以游客身份浏览</a></p>
            </form>
        </div>
    </main>
    <script src="js/theme.js?v=1"></script>
    <script src="js/register.js?v=1"></script>
</body>
</html>
