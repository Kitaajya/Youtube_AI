spring.application.name=Youtube
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.no-store=true
spring.web.resources.cache.cachecontrol.must-revalidate=true

spring.datasource.url=jdbc:mysql://localhost:3306/youtube?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
spring.datasource.username=youtube_app
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== MyBatis =====
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=org.designer.youtube.entity
# mybatis.configuration.map-underscore-to-camel-case=true

video.storage.dir=D:/videos/Video_Bilibili_Practice/videos
video.storage.url-prefix=/videos/**

spring.servlet.multipart.max-file-size=1024MB
spring.servlet.multipart.max-request-size=1024MB

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=deepseek-r1:8b
spring.data.redis.host=localhost
spring.data.redis.port=6379