<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动态 - YouTube</title>
    <link rel="stylesheet" href="css/vars.css">
    <script>(function(){try{var s=localStorage.getItem('yt-theme');var d=s==='dark'||(s!=='light'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.setAttribute('data-theme',d?'dark':'light');}catch(e){document.documentElement.setAttribute('data-theme','light');}})();</script>
    <link rel="stylesheet" href="css/dark.css">
    <link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
    <div id="app-header"></div>

    <div class="page">
        <div class="page-title">我的动态</div>
        <div class="note" id="dyn-note">
            后端动态查询接口要求同时提供<b>动态 ID + 完整内容 + 精确创建时间</b>三者完全一致才能命中，
            且没有“按用户列出全部动态”的接口，因此本页列表来自<b>本浏览器记录的镜像</b>；
            删除与修改会带上记录时的创建时间去请求后端，若后端返回失败会如实提示。
        </div>

        <div class="form-card" style="max-width:100%;margin-bottom:20px;">
            <div class="field">
                <label>发布新动态 <span class="req">*</span></label>
                <textarea id="dyn-content" maxlength="1000" placeholder="分享点什么…"></textarea>
            </div>
            <button class="btn red" id="dyn-write">发布</button>
            <p class="tip" id="dyn-tip" style="text-align:left;"></p>
        </div>

        <div class="form-card" style="max-width:100%;margin-bottom:20px;">
            <div class="page-title" style="font-size:15px;">按条件精确查询（调用后端 select 接口）</div>
            <div class="field"><label>动态 ID</label><input type="text" id="q-id" placeholder="13位ID"></div>
            <div class="field"><label>内容（需完全一致）</label><input type="text" id="q-content"></div>
            <div class="field"><label>创建时间（需完全一致，ISO 格式）</label><input type="text" id="q-time" placeholder="2026-10-10T12:00:00"></div>
            <button class="btn primary" id="dyn-query">查询</button>
            <div class="dyn-list" id="q-result"></div>
        </div>

        <div class="dyn-list" id="dyn-list"></div>
        <div class="empty" id="dyn-empty" style="display:none;">还没有动态，发布第一条吧</div>
    </div>

    <script src="js/theme.js?v=1"></script>
    <script src="js/common.js?v=12"></script>
    <script src="js/dynamic.js?v=6"></script>
</body>
</html>
