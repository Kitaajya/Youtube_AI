<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的频道 - YouTube</title>
    <link rel="stylesheet" href="css/vars.css">
    <script>(function(){try{var s=localStorage.getItem('yt-theme');var d=s==='dark'||(s!=='light'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.setAttribute('data-theme',d?'dark':'light');}catch(e){document.documentElement.setAttribute('data-theme','light');}})();</script>
    <link rel="stylesheet" href="css/dark.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app-header"></div>

    <div class="page">
        <div class="w-up" style="margin-bottom:20px;">
            <span class="avatar lg" id="ch-av" style="width:64px;height:64px;font-size:26px;"></span>
            <div>
                <div style="font-size:20px;font-weight:500;" id="ch-name">加载中…</div>
                <div class="w-stats" id="ch-id"></div>
            </div>
        </div>

        <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;">
            <div class="page-title" style="margin:0;">视频</div>
            <span class="w-stats" id="ch-count"></span>
            <a href="upload.html" class="btn red sm" id="ch-upload" style="margin-left:auto;display:none;">&#8679; 上传视频</a>
        </div>

        <div class="vlist" id="vlist"></div>
        <div class="empty" id="empty" style="display:none;"></div>
    </div>

    <script src="js/theme.js?v=1"></script>
    <script src="js/common.js?v=9"></script>
    <script src="js/profile.js?v=7"></script>
</body>
</html>
