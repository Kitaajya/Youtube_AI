<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>观看历史 - YouTube</title>
    <link rel="stylesheet" href="css/vars.css">
    <script>(function(){try{var s=localStorage.getItem('yt-theme');var d=s==='dark'||(s!=='light'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.setAttribute('data-theme',d?'dark':'light');}catch(e){document.documentElement.setAttribute('data-theme','light');}})();</script>
    <link rel="stylesheet" href="css/dark.css">
    <link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
    <div id="app-header"></div>

    <!-- 标题与说明：单独内边距条，列表用公共 .grid（自带 32px 内边距），避免双层缩进 -->
    <div class="his-head">
        <div class="page-title" style="margin-bottom:0;">观看历史<span class="w-stats" id="his-count" style="margin-left:10px;font-weight:400;"></span></div>
        <div class="note" style="margin-bottom:0;">后端一次返回最近 200 条记录，按观看时间倒序展示。</div>
    </div>
    <div id="his-list"></div>
    <div class="empty" id="his-empty" style="display:none;"></div>

    <script src="js/theme.js?v=1"></script>
    <script src="js/common.js?v=12"></script>
    <script src="js/history.js?v=1"></script>
</body>
</html>
