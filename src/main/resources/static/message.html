<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>私信 - YouTube</title>
    <link rel="stylesheet" href="css/vars.css">
    <script>(function(){try{var s=localStorage.getItem('yt-theme');var d=s==='dark'||(s!=='light'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.setAttribute('data-theme',d?'dark':'light');}catch(e){document.documentElement.setAttribute('data-theme','light');}})();</script>
    <link rel="stylesheet" href="css/dark.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/pm.css">
</head>
<body>
    <div id="app-header"></div>

    <div class="pm-wrap">
        <!-- 左栏：会话列表 -->
        <aside class="pm-side">
            <div class="pm-side-head">私信</div>
            <div class="pm-new">
                <input type="text" id="pm-peer-id" maxlength="13" placeholder="对方用户ID（13位）">
                <input type="text" id="pm-peer-name" maxlength="50" placeholder="备注名（可选）">
                <button class="btn sm primary" id="pm-open">开始对话</button>
            </div>
            <div class="pm-peers" id="pm-peers"></div>
        </aside>

        <!-- 右栏：聊天窗口 -->
        <main class="pm-main">
            <div class="pm-chat-head" id="pm-chat-head">选择左侧会话，或输入对方用户ID开始聊天</div>
            <div class="pm-msgs" id="pm-msgs">
                <div class="empty">还没有打开任何对话</div>
            </div>
            <div class="pm-input">
                <textarea id="pm-content" rows="2" placeholder="写私信…（Enter 发送，Shift+Enter 换行）"></textarea>
                <button class="btn red" id="pm-send">发送</button>
            </div>
        </main>
    </div>

    <script src="js/theme.js?v=1"></script>
    <script src="js/common.js?v=9"></script>
    <script src="js/message.js?v=1"></script>
</body>
</html>
